# Enable mouse support (scrolling, resizing panes, selecting)
set -g mouse on

# Huge scrollback buffer
set -g history-limit 500000

# Better terminal support
set -g default-terminal "tmux-256color"

# Keep tmux history when restarting server
set -g remain-on-exit off

# Faster escape time (better vim/neovim experience)
set -sg escape-time 0

# Use the default Ctrl-b command prefix.
unbind-key -q -n C-b
set -g prefix C-b

# Move between tmux panes with Ctrl-h/j/k/l, including while Neovim is focused.
# -n binds without the tmux prefix, so tmux handles these keys first.
bind-key -n C-h select-pane -L
bind-key -n C-j select-pane -D
bind-key -n C-k select-pane -U
bind-key -n C-l select-pane -R

# Ctrl-g splits side by side; Ctrl-f splits top/bottom.
bind-key -n C-g split-window -h
bind-key -n C-f split-window -v

# Close the current pane.
bind-key -n C-x kill-pane

# iTerm2 sends these sequences for Ctrl+Cmd+h/l/n.
# Switch between or create windows in the current tmux session.
set -s user-keys[0] "\e[9001~"
set -s user-keys[1] "\e[9002~"
set -s user-keys[2] "\e[9003~"
bind-key -n User0 previous-window
bind-key -n User1 next-window
bind-key -n User2 new-window
